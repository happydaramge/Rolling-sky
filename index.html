<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>롤링 스카이</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#fff;--bg:#7fb3e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#fff;--bg:#7fb3e8}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-weight:700;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:14px 18px;display:flex;gap:14px;align-items:center;pointer-events:none}
#bar{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.35);overflow:hidden}
#fill{height:100%;width:0;background:#fff;border-radius:5px}
#gems{font-size:18px;min-width:76px;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.25)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:rgba(40,60,110,.42);padding:24px}
#ov h1{margin:0;font-size:clamp(40px,10vw,68px);color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.2)}
#ov p{margin:0;font-size:16px;line-height:1.7;max-width:30em;color:#fff}
#go{font:inherit;font-size:21px;padding:13px 44px;border:0;border-radius:40px;color:#fff;background:#ff7a59;cursor:pointer;box-shadow:0 4px 0 #d85a3b}
#go:focus-visible{outline:3px solid #fff;outline-offset:3px}
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px 24px;background:rgba(20,28,60,.5);overflow:auto;text-align:center;touch-action:pan-y}
#home h1{margin:0;font-size:clamp(34px,8vw,56px);color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.25)}
#home .help{margin:0;font-size:14px;line-height:1.6;color:#fff;opacity:.9}
#maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:560px}
.card{font:inherit;color:#fff;border:3px solid transparent;border-radius:18px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:160px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.card.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 6px 16px rgba(0,0,0,.35)}
.card:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card .ic{font-size:30px}.card b{font-size:18px}.card small{font-size:12.5px;line-height:1.45;font-weight:600;opacity:.92}.card .stt{margin-top:auto;font-size:12px}
#st,#hm{font:inherit;font-size:20px;padding:13px 36px;border:0;border-radius:40px;color:#fff;background:#ff7a59;cursor:pointer;box-shadow:0 4px 0 #d85a3b}
#hm{background:#5a78d8;box-shadow:0 4px 0 #3f58ad}
#st:focus-visible,#hm:focus-visible{outline:3px solid #fff;outline-offset:3px}
#st{margin-top:auto}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#hb{pointer-events:auto;font-size:20px;line-height:1;background:rgba(255,255,255,.28);color:#fff;border:0;border-radius:10px;width:38px;height:34px;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none"><div id="bar"><div id="fill"></div></div><div id="gems">◆ 0/20</div><button id="hb" aria-label="홈">⌂</button></div>
<div id="ov" style="display:none"><h1 id="t"></h1><p id="m"></p><div class="row"><button id="go">다시 하기</button><button id="hm">홈으로</button></div></div>
<div id="home"><h1>롤링 스카이</h1><p class="help">드래그(또는 ← →)로 좌우 이동 · 색이 다른 점프칸을 밟으면 자동 점프<br>보석 20개를 모으며 끝까지 가세요</p><div id="maps"></div><button id="st">시작</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();

const N=420,GEMS=20,JV=10.5,GR=32,AIRT=.66,SY=.9,SR=.9,HY=1.5;
function spd(z){return Math.min(13.5+z*.013,21)*SPM}
let R=[],seed=7,lf=1;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MAPS=[
 {id:'cloud',name:'구름 위 산책',icon:'☁️',desc:'푸른 하늘 위를 가볍게 달려요. 점프와 가시 위주의 입문 맵.',seed:1234,hue:205,drift:8,sat:55,top:60,hl:85,bot:52,tl:77,diff:1,spm:.9,mul:{jump:1.5,jumps:1.3,plain:1.2,laser:.3,spin:.5,rocket:.4,slam:.6}},
 {id:'space',name:'별빛 우주',icon:'🪐',desc:'행성과 별 사이를 지나가요. 레이저와 로켓 바닥이 많아요.',seed:4242,hue:262,drift:12,sat:55,top:14,hl:30,bot:10,tl:74,diff:3,spm:1,mul:{laser:2,rocket:1.8,spin:1.4,rain:.6}},
 {id:'snow',name:'눈꽃 설원',icon:'❄️',desc:'눈 내리는 산악 지대. 흔들리는 바닥과 고드름 가시가 나와요.',seed:777,hue:215,drift:6,sat:50,top:38,hl:78,bot:32,tl:88,diff:2,spm:1,mul:{slide:2,rain:1.8,gate:1.2,laser:.6}},
 {id:'desert',name:'황금 사막',icon:'🏜️',desc:'뜨거운 노을 사막. 망치와 벽이 가득한 가장 어려운 맵.',seed:9001,hue:28,drift:6,sat:70,top:46,hl:76,bot:34,tl:78,diff:4,spm:1.08,mul:{slam:2,spin:1.6,wall:2,gate:1.6,slide:.5}}
];
let curMap=0;
try{curMap=clamp(+localStorage.getItem('rs_map')||0,0,MAPS.length-1)}catch(e){}
const $=id=>document.getElementById(id);
function ld(id){try{return JSON.parse(localStorage.getItem('rs_'+id))||{}}catch(e){return{}}}
function sv(id,o){try{localStorage.setItem('rs_'+id,JSON.stringify(o))}catch(e){}}
// 한 줄(row)에 장애물을 칸(tile) 단위로 배치: 빈 칸은 항상 1~2개
// 한 줄 장애물: 빈 칸 1~2개, 나머지는 가시/낮은 블록/높은 벽이 섞여서 막고 있다
let TW=4,SL=-2,LZ=[],FX=[],RK=[],SPM=1;
const lx=q=>q-(TW-1)/2;
function pick(ex,n){const a=[];for(let q=0;q<TW;q++)if(q!==ex)a.push(q);a.sort(()=>rnd()-.5);return a.slice(0,Math.min(n,a.length))}
// 한 줄 장애물: 빈 칸 1~3개, 막힌 칸은 이어진 구간마다 같은 종류(가시/낮은 블록/높은 기둥)라서 서로 붙지 않는다
function mk(g){
  // 직전(8줄 이내) 장애물 줄의 기둥 뒤쪽 칸은 가려져서 안 보이므로 가시를 놓지 않는다
  const PB=new Set();
  for(let j=g-1;j>=Math.max(0,g-8);j--){if(R[j].obs){R[j].obs.forEach(o=>{if(o.t==='b')PB.add(o.x)});break}}
  const far=rnd()<.25?3:2,free=new Set();
  lf=clamp(lf+Math.floor(rnd()*(2*far+1))-far,0,TW-1);free.add(lf);
  if(TW>=4&&rnd()<.15)free.add(lf<TW-1?lf+1:lf-1);
  const o=[];let run=[];
  const flush=()=>{
    if(!run.length)return;
    const hid=run.some(j=>PB.has(lx(j)));
    const t=(!hid&&rnd()<.4)?{t:'s',h:1}:(rnd()<.45?{t:'b',h:1}:{t:'b',h:1.8});
    run.forEach(j=>o.push({x:lx(j),t:t.t,h:t.h}));run=[];
  };
  for(let j=0;j<TW;j++){if(free.has(j))flush();else run.push(j)}
  flush();
  return o;
}
// 휘어지는 벽 복도: 2칸 폭 통로가 구간마다 좌우로 한 칸씩 움직인다
function wallRun(g){
  let f=Math.floor(rnd()*(TW-1));
  const segs=2+Math.floor(rnd()*2);
  for(let s=0;s<segs;s++){
    const L=1+Math.floor(rnd()*2);
    for(let j=0;j<L;j++){const o=[];for(let q=0;q<TW;q++)if(q!==f&&q!==f+1)o.push({x:lx(q),t:'b',h:1.8,lg:true});R[g++].obs=o}
    f=clamp(f+(rnd()<.5?-1:1),0,TW-2);g++;
  }
  lf=f;return g;
}
// 관문: 한 칸만 뚫린 벽이 연속으로, 뚫린 칸이 매번 달라진다
function gates(g){
  const n=2+Math.floor(rnd()*3);
  for(let k=0;k<n;k++){
    if(g>N-24)break;
    lf=clamp(lf+Math.floor(rnd()*5)-2,0,TW-1);
    for(let j=0;j<2;j++)R[g++].obs=[...Array(TW).keys()].filter(q=>q!==lf).map(q=>({x:lx(q),t:'b',h:1.8,lg:true}));
    g+=Math.max(3,Math.round(spd(g)*.2));
  }
  return g;
}
// 가시 비: 줄마다 떨어지는 칸 수(1~3)와 위치가 제각각, 안전한 칸은 항상 있다
function rain(g){
  const n=1+Math.floor(rnd()*3);
  for(let k=0;k<n;k++){
    if(g>N-24)break;
    lf=clamp(lf+Math.floor(rnd()*5)-2,0,TW-1);
    R[g].drops=pick(lf,1+Math.floor(rnd()*3)).map(q=>({x:lx(q),y:9,st:0}));
    g+=Math.max(3,Math.round(spd(g)*.2));
  }
  return g;
}
// 레이저포: 발사블럭이 줄 맨 앞에 있고, 공이 1.5칸 전에 오면 그 줄 앞쪽 전체로 빔을 쏜다
function lasers(g){
  let L=14+Math.floor(rnd()*9);L=Math.min(L,N-22-g);if(L<8)return N;
  lf=clamp(lf+Math.floor(rnd()*5)-2,0,TW-1);
  pick(lf,1+Math.floor(rnd()*3)).forEach(q=>{
    const o={x:lx(q),s:g,e:g+L-1,st:0,f:g};LZ.push(o);
    for(let j=g;j<g+L;j++)(R[j].lz=R[j].lz||[]).push(o);
  });
  return g+L;
}
// 내려찍는 망치: 표시된 한 칸을 때린다
function slams(g){
  const n=1+Math.floor(rnd()*3);
  for(let k=0;k<n;k++){
    if(g>N-24)break;
    lf=clamp(lf+Math.floor(rnd()*5)-2,0,TW-1);
    R[g].hams=pick(lf,1+Math.floor(rnd()*3)).map(q=>{
      const left=q<=(TW-1)/2,d=Math.min(q,TW-1-q)+.8,len=Math.hypot(d,HY);
      return {x:lx(q),s:left?1:-1,xp:left?-TW/2-.3:TW/2+.3,len,hit:Math.acos(HY/len),th:2.6,st:0,t:0};
    });
    g+=Math.max(3,Math.round(spd(g)*.2));
  }
  return g;
}
// 세로로 도는 망치: 머리가 아래로 내려올 때 바로 아래 한 칸을 때린다
function segd(px,pz,ax,az,bx,bz){const dx=bx-ax,dz=bz-az,t=clamp(((px-ax)*dx+(pz-az)*dz)/(dx*dx+dz*dz),0,1);return Math.hypot(px-ax-t*dx,pz-az-t*dz)}
// 1번 망치: 공이 도착할 시각(tau)을 기준으로 박자를 맞춘다 (tau=0 일 때 바닥을 찍고 있음)
function hamTh(h,j){
  const tau=(j+.5-P.z)/P.sp,ph=((-tau/.7)%1+1)%1,up=2.6,hit=h.hit;
  if(ph<.12)return hit;
  if(ph<.55){const t=(ph-.12)/.43;return hit+(up-hit)*(t*t*(3-2*t))}
  if(ph<.8)return up;
  if(ph<.93){const t=(ph-.8)/.13;return up+(hit-up)*t*t}
  return hit;
}
// 2번 망치: 왼쪽/오른쪽 끝에서 멈췄다가 휘웅 하고 반대쪽으로 넘어가는 끊기는 스윙
function swingA(h){
  const u=(((P.t/h.T+h.ph)%2)+2)%2,half=Math.floor(u),f=u-half;
  let k=f<.72?0:(f-.72)/.28;k=k*k*(3-2*k);
  if(half===0)return h.side>0?Math.PI*(1-k):Math.PI+Math.PI*k;
  return h.side>0?Math.PI*k:2*Math.PI-Math.PI*k;
}
function spinners(g){
  const n=1+Math.floor(rnd()*3);
  for(let k=0;k<n;k++){
    if(g>N-24)break;
    const ls=pick(-1,TW>=5?2:1).sort((a,b)=>a-b),use=ls.filter((q,i)=>i===0||q-ls[i-1]>=3);
    R[g].spin=use.map(q=>({x:lx(q),ph:rnd()*2,T:1.1+rnd()*.5,side:rnd()<.5?1:-1}));
    g+=Math.max(4,Math.round(spd(g)*.22));
  }
  return g;
}
// 움직이는 바닥: 좁은 바닥 띠가 구멍 위에서 좌우로 흔들린다. 올라타서 같이 움직여야 한다
function mvSc(r,j){return r.mv.amp*Math.sin(P.t*r.mv.w+j*.12+r.mv.ph)*r.mv.r}
function slider(g){
  const L=12+Math.floor(rnd()*7),wide=TW>=4&&rnd()<.5,sh=wide?1.5:1,amp=Math.max(.4,TW/2-sh),w=2.2+rnd(),ph=rnd()*6.28;
  for(let k=0;k<L;k++){const r=R[g+k];r.sh=sh;r.mv={amp,w,ph,r:Math.min(1,(k+1)/3,(L-k)/3)}}
  return g+L;
}
// 로켓 바닥: 십자가 모양(5칸) 바닥이 플레이어가 가까이 오면 위로 발사되고 구멍이 남는다
function rockets(g){
  const n=1+(rnd()<.45?1:0);
  for(let k=0;k<n;k++){
    if(g>N-30)break;
    let f=clamp(lf+Math.floor(rnd()*3)-1,0,TW-1);if(TW===3&&f===1)f=rnd()<.5?0:2;lf=f;
    const cs=[];for(let q=0;q<TW;q++)if(Math.abs(q-f)>=2)cs.push(q);
    const cl=cs[Math.floor(rnd()*cs.length)],j0=g+1,grp={j0,st:0,t:0,y:0};RK.push(grp);
    const add=(row,q)=>{if(q<0||q>=TW)return;(R[row].rk=R[row].rk||[]).push({x:lx(q),g:grp})};
    add(j0,cl);add(j0,cl-1);add(j0,cl+1);add(j0-1,cl);add(j0+1,cl);
    g+=7;
  }
  return g;
}
function airD(z){return spd(z)*AIRT}
// 연속 점프: 점프칸 -> 구멍 -> (좁은) 발판 끝의 점프칸 -> 구멍 ...
function chain(p,n){
  n=Math.min(n,Math.floor((N-40-p)/20));if(n<1)return N;
  const m=rnd()<.4?1:1+Math.floor(rnd()*TW),st=Math.floor(rnd()*(TW-m+1));
  R[p].pad=true;R[p].px=st+m/2-TW/2;R[p].pw=m/2;
  let z=p+.1,prevEnd=p;
  for(let k=0;k<n;k++){
    const zl=z+airD(z);
    for(let j=Math.floor(z);j<=Math.ceil(zl)+1&&j<N;j++)R[j].air=true;
    let gEnd;
    if(k<n-1){
      const q=Math.round(zl-1.5),wide=rnd()<.35,sc=wide?Math.floor(rnd()*(TW-1))+1-TW/2:Math.floor(rnd()*TW)+.5-TW/2,sh=wide?1:.5;
      gEnd=q-1;
      for(let j=q;j<q+3;j++){R[j].sh=sh;R[j].sc=sc;R[j].air=true}
      R[q+2].pad=true;R[q+2].px=sc;R[q+2].pw=sh;
      for(let j=prevEnd+1;j<=gEnd;j++)R[j].gap=true;
      prevEnd=q+2;z=q+2.1;
    }else{
      gEnd=Math.min(prevEnd+3+Math.floor(rnd()*3),Math.floor(zl-2));
      for(let j=prevEnd+1;j<=gEnd;j++)R[j].gap=true;
      z=zl;
    }
  }
  return Math.ceil(z)+3;
}
function build(){
  seed=MAPS[curMap].seed;SPM=MAPS[curMap].spm;R=[];lf=1;TW=4;SL=-2;LZ=[];RK=[];
  for(let i=0;i<N;i++)R.push({c:0,tw:4,hw:2,sc:0,sh:2,gap:false,obs:null,drops:null,hams:null,spin:null,lz:null,gem:null,pad:false,px:0,pw:.5,air:false,got:false,gy:.9});
  const setW=a=>{for(let i=a;i<N;i++){const r=R[i];r.tw=TW;r.c=SL+TW/2;r.hw=TW/2;r.sh=TW/2}};
  setW(0);
  let g=16;
  while(g<N-30){
    // 트랙 폭(3~6칸)과 좌우 위치가 패턴 사이에서 바뀐다 (이전 구간과 2칸 이상 겹치게)
    if(g>30&&g<N-110&&rnd()<.4){
      const ol=SL,ws=[3,4,4],tw=ws[Math.floor(rnd()*ws.length)];
      const Lt=clamp(SL+Math.floor(rnd()*5)-2,Math.ceil(-3-tw/2),Math.floor(3-tw/2)),Rt=Lt+tw;
      let a=SL,b=SL+TW;
      while(a!==Lt||b!==Rt){
        {const w=b-a,exL=a>Lt,exR=b<Rt,shL=a<Lt,shR=b>Rt;if(w<4&&(exL||exR)){if(exL)a--;else b++}else if(shL)a++;else if(shR)b--;else if(exL)a--;else b++}
        SL=a;TW=b-a;setW(g);lf=clamp(lf,0,TW-1);R[g+3].obs=mk(g+3);g+=6;
      }
      lf=clamp(lf+ol-SL,0,TW-1);
    }
    const k=rnd(),sp=Math.round(spd(g)*.28)+Math.floor(rnd()*2);
    const MP=MAPS[curMap],PATS=[['jump',10],['jumps',10],['rain',9],['wall',6],['gate',7],['laser',9],['slam',8],['spin',8],['slide',8],['rocket',12],['plain',13]];
    let tot=0;const ws=PATS.map(q=>{const w=q[1]*(MP.mul[q[0]]||1);tot+=w;return w});
    let x=rnd()*tot,pi=0;while(pi<ws.length-1&&x>=ws[pi]){x-=ws[pi];pi++}
    const pn=PATS[pi][0];
    if(pn==='jump')g=chain(g,1);
    else if(pn==='jumps')g=chain(g,2+Math.floor(rnd()*3));
    else if(pn==='rain')g=rain(g)+sp;
    else if(pn==='wall')g=wallRun(g)+sp;
    else if(pn==='gate')g=gates(g)+sp;
    else if(pn==='laser')g=lasers(g)+sp;
    else if(pn==='slam')g=slams(g)+sp;
    else if(pn==='spin')g=spinners(g)+sp;
    else if(pn==='slide')g=slider(g)+sp;
    else if(pn==='rocket')g=rockets(g)+sp;
    else{const n=1+Math.floor(rnd()*3);for(let q=0;q<n;q++){R[g].obs=mk(g);g+=sp}}
  }
  // 보석 20개: 앞뒤 6줄 동안 같은 줄(세로 방향)에 위험물이 없고 점프/움직이는 바닥 구간도 아닌 칸에만 둔다
  const hzx=k=>{const r=R[k],b=[];[...(r.obs||[]),...(r.drops||[]),...(r.hams||[]),...(r.lz||[])].forEach(o=>b.push(r.c+o.x));(r.spin||[]).forEach(o=>{for(let d=-1;d<=1;d++)b.push(r.c+o.x+d)});return b};
  const badRow=k=>R[k].gap||R[k].air||R[k].pad||R[k].mv||R[k].rk;

    else{const rr=s*(.6+u*.5);poly([[p[0],p[1]-rr*1.5],[p[0]+rr*.7,p[1]],[p[0],p[1]+rr*1.5],[p[0]-rr*.7,p[1]]],C(180,80,66));poly([[p[0],p[1]-rr*1.5],[p[0]+rr*.7,p[1]],[p[0],p[1]]],C(180,85,82))}
  }else{
    const sn=id==='snow',w=s*(1.4+u*.8),by=p[1]+s*.1;
    poly([[p[0]-w,p[1]+s*.2],[p[0]+w,p[1]+s*.2],[p[0]+w*.35,p[1]+s*1.3],[p[0]-w*.35,p[1]+s*1.3]],sn?C(H0,25,38):C(30,40,28));
    ctx.fillStyle=sn?C(H0,15,93):C(40,55,62);ctx.beginPath();ctx.ellipse(p[0],p[1]+s*.2,w,w*.3,0,0,7);ctx.fill();
    if(sn){for(let k=0;k<3;k++){const wk=s*(1.1-k*.28),yy=by-s*(.5+k*.7);poly([[p[0]-wk,yy+s*.55],[p[0]+wk,yy+s*.55],[p[0],yy-s*.55]],C(150,40,26));poly([[p[0]-wk*.45,yy],[p[0]+wk*.45,yy],[p[0],yy-s*.55]],C(H0,10,96))}}
    else if(v<.5){const bw=s*1.3,hh=s*1.9;poly([[p[0]-bw,by],[p[0],by-hh],[p[0]+bw*.1,by+s*.1]],C(42,60,70));poly([[p[0],by-hh],[p[0]+bw,by],[p[0]+bw*.1,by+s*.1]],C(36,55,50))}
    else{ctx.fillStyle=C(125,45,34);ctx.fillRect(p[0]-s*.22,by-s*1.8,s*.44,s*1.8);circ(p[0],by-s*1.8,s*.22,C(125,45,34));ctx.fillRect(p[0]-s*.7,by-s*1.1,s*.5,s*.26);ctx.fillRect(p[0]-s*.7,by-s*1.5,s*.26,s*.66);ctx.fillRect(p[0]+s*.2,by-s*.8,s*.5,s*.26);ctx.fillRect(p[0]+s*.44,by-s*1.2,s*.26,s*.66)}
  }
}
// ---------- 홈 화면 ----------
function buildCards(){
  $('maps').innerHTML='';
  MAPS.forEach((m,i)=>{
    const b=ld(m.id),c=document.createElement('button');
    c.className='card'+(i===curMap?' sel':'');
    c.style.background=`linear-gradient(160deg,hsl(${m.hue} ${m.sat}% ${Math.max(18,m.top-14)}%),hsl(${(m.hue+20)%360} ${m.sat}% ${Math.max(28,m.hl-26)}%))`;
    c.innerHTML=`<span class="ic">${m.icon}</span><b>${m.name}</b><small>${m.desc}</small><span class="stt">${'★'.repeat(m.diff)+'☆'.repeat(4-m.diff)}${b.clear?' · 🏁 클리어':''} · ◆ ${b.gems||0}/${GEMS}</span>`;
    c.onclick=()=>selectMap(i);$('maps').appendChild(c);
  });
  $('st').textContent='▶ '+MAPS[curMap].name+' 시작';
}
function selectMap(i){curMap=i;try{localStorage.setItem('rs_map',i)}catch(e){}reset();buildCards()}
function goHome(){state='menu';$('ov').style.display='none';$('hud').style.display='none';$('home').style.display='flex';reset();buildCards()}
function startGame(){reset();state='play';$('home').style.display='none';$('ov').style.display='none';$('hud').style.display='flex'}
function draw(){
  F=H*.8;hy=H*.25;camZ=P.z-7;
  const MP=MAPS[curMap];H0=(MP.hue+Math.sin(P.t*.15)*MP.drift+360)%360;const hl=MP.hl;
  const fc=rgb(H0,MP.sat+8,hl);FR=fc[0];FGc=fc[1];FB=fc[2];fogK=0;
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*10;sy=(Math.random()-.5)*10}
  ctx.save();ctx.translate(sx,sy);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,hs(H0,MP.sat,MP.top));g.addColorStop(.25,hs(H0,MP.sat+8,hl));g.addColorStop(1,hs(H0,MP.sat-5,MP.bot));
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  drawSky(MP);
  const start=Math.max(0,Math.floor(camZ)),end=Math.min(N-1,Math.floor(P.z)+52),pi=Math.min(Math.floor(P.z),N-1);
  for(let j=start;j<=end;j++){const q=R[j];if(q.mv)q.sc=mvSc(q,j)}
  const hb={};
  for(let j=start;j<=Math.min(N-1,end+1);j++){const q=R[j];if(q.spin)q.spin.forEach(h=>{const a=swingA(h),k=clamp(Math.floor(Math.min(j+.3,j+.5+Math.sin(a)-.45)),start,end);(hb[k]=hb[k]||[]).push([h,j,a])})}
  for(let i=end;i>=start;i--){
    const r=R[i],z0=Math.max(i,camZ+.5),z1=i+1;
    if(z1<=camZ+.5)continue;
    fogK=clamp((i-P.z-14)/36,0,1);drawDeco(r,i,MP);
    if(!r.gap){
      const sl=r.c+r.sc-r.sh,sr=r.c+r.sc+r.sh,nt=Math.round(r.sh*2);
      if(!r.rk)poly([pr(sl,0,z0),pr(sr,0,z0),pr(sr,0,z1),pr(sl,0,z1)],C(H0,32,56));
      for(let j=0;j<nt;j++){
        const a=sl+j+.04,b=sl+j+.96,cx=sl+j+.5-r.c,za=Math.max(i+.04,camZ+.5),zb=i+.96;
        const rt=r.rk&&r.rk.find(t=>t.x===cx);if(rt&&rt.g.st>=1)continue;if(r.rk)poly([pr(a-.04,0,z0),pr(b+.04,0,z0),pr(b+.04,0,z1),pr(a-.04,0,z1)],C(H0,32,56));
        const isPad=r.pad&&Math.abs(cx-r.px)<=r.pw-.5+.01,isDrop=(r.drops&&r.drops.some(d=>d.x===cx))||(r.hams&&r.hams.some(d=>d.x===cx));
        let h=H0,sa=30,l=isDrop?62:MP.tl;
        if(isPad){h=H0+75;sa=75;l=58}
        if(rt){h=12;sa=88;l=52}
        poly([pr(a,0,za),pr(b,0,za),pr(b,0,zb),pr(a,0,zb)],C(h,sa,l));
        poly([pr(a,0,za),pr(b,0,za),pr(b,-.12,za),pr(a,-.12,za)],C(h,sa,l-14));
      }
      const wc=C(H0,32,46);
      if(camX>sl)poly([pr(sl,0,z0),pr(sl,0,z1),pr(sl,-.7,z1),pr(sl,-.7,z0)],wc);
      if(camX<sr)poly([pr(sr,0,z0),pr(sr,0,z1),pr(sr,-.7,z1),pr(sr,-.7,z0)],wc);
      if(i>0&&i>=camZ+.5){
        const pv=R[i-1],fc=C(H0,34,40);
        if(pv.gap)poly([pr(sl,0,i),pr(sr,0,i),pr(sr,-.7,i),pr(sl,-.7,i)],fc);
        else{
          const a=pv.c+pv.sc-pv.sh,b=pv.c+pv.sc+pv.sh;
          if(sl<a-.01){const e=Math.min(sr,a);poly([pr(sl,0,i),pr(e,0,i),pr(e,-.7,i),pr(sl,-.7,i)],fc)}
          if(sr>b+.01){const s0=Math.max(sl,b);poly([pr(s0,0,i),pr(sr,0,i),pr(sr,-.7,i),pr(s0,-.7,i)],fc)}
        }
      }
    }
    if(r.obs)r.obs.slice().sort((a,b)=>Math.abs(b.x+r.c-camX)-Math.abs(a.x+r.c-camX)).forEach(o=>drawObs(r,i,o));
    if(r.drops)r.drops.forEach(d=>drawObs(r,i,{x:d.x,t:'s',h:1},d.y));
    if(r.lz)r.lz.forEach(L=>{
      const za=Math.max(i,L.f),zb=Math.min(i+1,L.e-.18);
      if(L.st===1&&zb>za){const x=r.c+L.x;poly([pr(x-.46,0,za),pr(x+.46,0,za),pr(x+.46,0,zb),pr(x-.46,0,zb)],C(352,80,56));box(x-.4,x+.4,za,zb,.35,1.05,355,90,48);box(x-.18,x+.18,za,zb,.45,1.1,15,55,88)}
      if(L.e===i)drawEm(r,i,L);
    });
    if(r.hams)r.hams.forEach(h=>drawHam(r,i,h));
    if(r.rk)r.rk.forEach(t=>{if(t.g.st===1)drawRk(r,i,t)});
    if(hb[i])hb[i].forEach(q=>drawSpin(R[q[1]],q[1],q[0],q[2]));
    if(r.gem!=null&&!r.got)drawGem(r,i);
    if(i===pi)ball();
  }
  if(MP.id==='snow'){ctx.fillStyle='#fff';for(let k=0;k<70;k++){const x=((hsh(k)*W+Math.sin(P.t*.9+k)*18-camX*14*(.4+hsh(k+1)))%W+W)%W,y=(P.t*(50+hsh(k+2)*70)+hsh(k+3)*H)%H;ctx.globalAlpha=.5+.4*hsh(k+4);ctx.beginPath();ctx.arc(x,y,1+hsh(k+5)*2.2,0,7);ctx.fill()}ctx.globalAlpha=1}
  const now=performance.now();FX=FX.filter(f=>now-f.t<450);
  if(FX.length){
    const bp=pr(P.x,.46+P.y,P.z),bs=bp[2]*.46;
    FX.forEach(f=>{
      const a=(now-f.t)/450,al=1-a;
      ctx.globalAlpha=al;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bp[0],bp[1],bs*(1.3+a*2.2),0,7);ctx.stroke();
      ctx.fillStyle='#ff9ecb';
      for(let k=0;k<8;k++){const an=k*.785+.3,rr=bs*(1.2+a*2.8);ctx.beginPath();ctx.arc(bp[0]+Math.cos(an)*rr,bp[1]+Math.sin(an)*rr,bs*.16*al+1,0,7);ctx.fill()}
    });
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function ball(){
  const sh=pr(P.x,0,P.z),p=pr(P.x,.46+P.y,P.z),s=p[2]*.46;
  if(!P.fall&&P.y>=0){ctx.fillStyle='rgba(20,30,60,.25)';ctx.beginPath();ctx.ellipse(sh[0],sh[1],s*(1-Math.min(P.y,2)*.15),s*.3,0,0,7);ctx.fill()}
  const g=ctx.createRadialGradient(p[0]-s*.35,p[1]-s*.4,s*.1,p[0],p[1],s);
  g.addColorStop(0,'#fff6e0');g.addColorStop(.45,'#ffc65c');g.addColorStop(1,'#f0873a');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p[0],p[1],s,0,7);ctx.fill();
}
let last=performance.now();
reset();buildCards();$('st').onclick=startGame;$('hm').onclick=goHome;$('hb').onclick=goHome;$('hb').addEventListener('pointerdown',e=>e.stopPropagation());
function loop(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(shake>0)shake-=dt;
  updDrops(dt);
  update(dt);
  if(state==='menu'){P.z=1+((t/1000*6)%60);P.x=R[Math.floor(P.z)].c;P.t=t/1000;camX=P.x}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
