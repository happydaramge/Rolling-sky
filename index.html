<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>롤링 스카이</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#fff;--bg:#7fb3e8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#fff;--bg:#7fb3e8}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-weight:700;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:14px 18px;display:flex;gap:14px;align-items:center;pointer-events:none}
#bar{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.35);overflow:hidden}
#fill{height:100%;width:0;background:#fff;border-radius:5px}
#gems{font-size:18px;min-width:76px;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.25)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:rgba(40,60,110,.42);padding:24px}
#ov h1{margin:0;font-size:clamp(40px,10vw,68px);color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.2)}
#ov p{margin:0;font-size:16px;line-height:1.7;max-width:30em;color:#fff}
#go{font:inherit;font-size:21px;padding:13px 44px;border:0;border-radius:40px;color:#fff;background:#ff7a59;cursor:pointer;box-shadow:0 4px 0 #d85a3b}
#go:focus-visible{outline:3px solid #fff;outline-offset:3px}
#home{position:fixed;inset:0;display:flex;flex-direction:column;background:rgba(20,28,60,.6)}
#pages{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 8px;touch-action:pan-y;display:flex;justify-content:center}
#pages section{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
#home h1{margin:0;text-align:center;font-size:clamp(30px,7vw,46px);color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.25)}
#keys,#wal{text-align:center;color:#fff;font-size:15px}
#maps,#items{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.mrow{font:inherit;color:#fff;border:3px solid transparent;border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.mrow.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 5px 14px rgba(0,0,0,.35)}
.mrow:focus-visible{outline:3px solid #fff;outline-offset:2px}
.mrow .ic{font-size:34px;flex:none}
.mrow .tx,.irow .tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.mrow b{font-size:18px}.mrow small{font-size:12.5px;line-height:1.4;font-weight:600;opacity:.92}.mrow .stt{font-size:12px}
.irow{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.14);border-radius:16px;padding:12px 14px;color:#fff}
.irow .sw{width:42px;height:42px;border-radius:50%;flex:none}
.irow b{font-size:17px}.irow small{font-size:12.5px;opacity:.9}
.irow button{font:inherit;font-size:14px;padding:8px 16px;border:0;border-radius:20px;background:#ff7a59;color:#fff;cursor:pointer}
.irow button:disabled{background:rgba(255,255,255,.25);cursor:default}
#st,#hm{font:inherit;font-size:20px;padding:13px 36px;border:0;border-radius:40px;color:#fff;background:#ff7a59;cursor:pointer;box-shadow:0 4px 0 #d85a3b}
#hm{background:#5a78d8;box-shadow:0 4px 0 #3f58ad}
#st:focus-visible,#hm:focus-visible{outline:3px solid #fff;outline-offset:3px}
#st{align-self:center;margin:8px 0 12px;min-width:min(78vw,320px)}
#tabs{display:flex;background:rgba(14,18,44,.92);border-top:1px solid rgba(255,255,255,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;font:inherit;font-size:16px;padding:14px 0;border:0;background:none;color:rgba(255,255,255,.6);cursor:pointer}
#tabs button.on{color:#fff;box-shadow:inset 0 3px 0 #ff7a59}
#ov p{white-space:pre-line}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#hb{pointer-events:auto;font-size:20px;line-height:1;background:rgba(255,255,255,.28);color:#fff;border:0;border-radius:10px;width:38px;height:34px;cursor:pointer}
#st:disabled{opacity:.55;cursor:default}
.mrow.lock{filter:saturate(.5) brightness(.8)}
.mrow.hid{filter:none;box-shadow:0 0 0 2px #c58bff,0 0 18px rgba(197,139,255,.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none"><div id="bar"><div id="fill"></div></div><div id="gems">◆ 0/20</div><button id="hb" aria-label="홈">⌂</button></div>
<div id="ov" style="display:none"><h1 id="t"></h1><p id="m"></p><div class="row"><button id="go">다시 하기</button><button id="hm">홈으로</button></div></div>
<div id="home">
<div id="pages">
<section id="pg-game"><h1>롤링 스카이</h1><div id="keys"></div><div id="maps"></div></section>
<section id="pg-shop" style="display:none"><h1>상점</h1><div id="wal"></div><div id="items"></div></section>
</div>
<button id="st">▶ 플레이</button>
<nav id="tabs"><button id="tb-shop">🛒 상점</button><button id="tb-game" class="on">🎮 게임</button></nav>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);rs();

const N=480,GEMS=20,JV=10.5,GR=32,AIRT=.66,SY=.9,SR=.9,HY=1.5;
function spd(z){return Math.min(14+z*.014,22)*SPM}
let R=[],seed=7,lf=1;
function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const MAPS=[
 {id:'cloud',name:'구름 위 산책',icon:'☁️',desc:'푸른 하늘 위를 달려요. 점프와 가시가 중심인 입문 맵.',seed:1234,hue:205,drift:8,sat:55,top:60,hl:85,bot:52,tl:77,diff:1,spm:1.02,den:0.88,mul:{jump:1.4,jumps:1.1,crumble:.8,laser:.3,spin:.6,rocket:.5,slam:.7,wall:.8}},
 {id:'space',name:'별빛 우주',icon:'🪐',desc:'행성과 별 사이를 지나가요. 레이저와 로켓 바닥이 많아요.',seed:4242,hue:262,drift:12,sat:55,top:14,hl:30,bot:10,tl:74,diff:2,spm:1.06,den:0.79,mul:{laser:2,rocket:1.6,spin:1.3,rain:.6,plain:.8}},
 {id:'snow',name:'눈꽃 설원',icon:'❄️',desc:'눈 내리는 산악 지대. 흔들리는 바닥과 고드름 가시가 나와요.',seed:777,hue:215,drift:6,sat:50,top:38,hl:78,bot:32,tl:88,diff:3,spm:1.1,den:0.71,mul:{slide:1.8,rain:1.6,gate:1.2,crumble:1.3,laser:.7,plain:.8}},
 {id:'desert',name:'황금 사막',icon:'🏜️',desc:'뜨거운 노을 사막. 망치, 벽, 점프가 한꺼번에 몰려와요.',seed:9001,hue:28,drift:6,sat:70,top:46,hl:76,bot:34,tl:78,diff:4,spm:1.14,den:0.58,mul:{slam:1.7,spin:1.5,wall:1.5,gate:1.4,jumps:1.3,rocket:1.2,laser:1.1,slide:.8,plain:.6}},
 {id:'sea',name:'심해 정원',icon:'🌊',desc:'빛이 닿는 깊은 바다. 부서지는 발판과 흔들리는 바닥이 많아요.',seed:31337,hue:195,drift:6,sat:60,top:30,hl:55,bot:18,tl:80,diff:5,spm:1.18,den:0.5,mul:{slide:1.6,crumble:1.2,laser:1.3,rain:1.3,jump:1.2,plain:.6}},
 {id:'city',name:'네온 도시',icon:'🌆',desc:'불 켜진 밤의 도시. 레이저와 도는 망치가 쉴 틈 없이 나와요.',seed:2077,hue:300,drift:14,sat:60,top:12,hl:28,bot:8,tl:72,diff:6,spm:1.22,den:0.49,mul:{laser:1.8,spin:1.6,rocket:1.5,gate:1.4,jumps:1.3,plain:.5}},
 {id:'lava',name:'용암 화산',icon:'🌋',desc:'끓는 용암 위의 길. 로켓 바닥과 망치가 쏟아져요.',seed:6666,hue:8,drift:6,sat:75,top:14,hl:36,bot:8,tl:70,diff:7,spm:1.26,den:0.44,mul:{rocket:2,slam:1.8,spin:1.4,crumble:1.4,wall:1.4,jumps:1.3,plain:.4}},
 {id:'hole',name:'블랙홀',icon:'🕳️',desc:'모든 장애물이 총출동하는 가장 어려운 맵.',seed:1313,hue:275,drift:10,sat:50,top:6,hl:20,bot:4,tl:68,diff:8,spm:1.3,den:0.39,mul:{laser:1.6,rocket:1.6,spin:1.6,slam:1.6,slide:1.5,crumble:1.6,jumps:1.6,wall:1.3,gate:1.3,rain:1.3,plain:.2}},
 {id:'rift',hidden:true,name:'균열의 방',icon:'🌀',desc:'균열 너머의 비밀 공간. 극악의 난이도.',seed:8888,hue:300,drift:0,sat:75,top:8,hl:24,bot:4,tl:74,diff:9,spm:1.38,den:.34,mul:{laser:1.2,rocket:2.4,spin:2.4,slam:2.4,slide:1.8,crumble:.9,jumps:1,wall:2.2,gate:2.4,rain:2.4,plain:.6}}
];
const NV=MAPS.filter(m=>!m.hidden).length;
let curMap=0,DEN=1;
try{curMap=clamp(+localStorage.getItem('rs_map')||0,0,MAPS.length-1)}catch(e){}
const $=id=>document.getElementById(id);
function ld(id){try{return JSON.parse(localStorage.getItem('rs_'+id))||{}}catch(e){return{}}}
function sv(id,o){try{localStorage.setItem('rs_'+id,JSON.stringify(o))}catch(e){}}
// 한 줄(row)에 장애물을 칸(tile) 단위로 배치: 빈 칸은 항상 1~2개
// 한 줄 장애물: 빈 칸 1~2개, 나머지는 가시/낮은 블록/높은 벽이 섞여서 막고 있다
let TW=4,SL=-2,LZ=[],FX=[],RK=[],SPM=1;
const lx=q=>q-(TW-1)/2;
const shift=()=>DEN<.7?Math.floor(rnd()*3)-1:Math.floor(rnd()*5)-2;
function pick(ex,n){const a=[];for(let q=0;q<TW;q++)if(q!==ex)a.push(q);a.sort(()=>rnd()-.5);return a.slice(0,Math.min(n,a.length))}
// 한 줄 장애물: 빈 칸 1~3개, 막힌 칸은 이어진 구간마다 같은 종류(가시/낮은 블록/높은 기둥)라서 서로 붙지 않는다
function mk(g){
  // 직전(8줄 이내) 장애물 줄의 기둥 뒤쪽 칸은 가려져서 안 보이므로 가시를 놓지 않는다
  const PB=new Set();
  for(let j=g-1;j>=Math.max(0,g-8);j--){if(R[j].obs){R[j].obs.forEach(o=>{if(o.t==='b')PB.add(o.x)});break}}
  const far=Math.min(rnd()<.25?3:2,DEN<.7?1:3),free=new Set();
  lf=clamp(lf+Math.floor(rnd()*(2*far+1))-far,0,TW-1);free.add(lf);
  if(TW>=4&&rnd()<.15)free.add(lf<TW-1?lf+1:lf-1);
  const o=[];let run=[];
  const flush=()=>{
    if(!run.length)return;
    const hid=run.some(j=>PB.has(lx(j)));
    const t=(!hid&&rnd()<.4)?{t:'s',h:1}:(rnd()<.45?{t:'b',h:1}:{t:'b',h:1.8});
    run.forEach(j=>o.push({x:lx(j),t:t.t,h:t.h}));run=[];
  };
  for(let j=0;j<TW;j++){if(free.has(j))flush();else run.push(j)}
  flush();
  return o;
}
// 휘어지는 벽 복도: 2칸 폭 통로가 구간마다 좌우로 한 칸씩 움직인다
function wallRun(g){
  let f=Math.floor(rnd()*(TW-1));
  const segs=2+(MAPS[curMap].diff>=6?Math.floor(rnd()*2):0);
  for(let s=0;s<segs;s++){
    const L=1+Math.floor(rnd()*2);
    for(let j=0;j<L;j++){const o=[];for(let q=0;q<TW;q++)if(q!==f&&q!==f+1)o.push({x:lx(q),t:'b',h:1.8,lg:true});R[g++].obs=o}
    f=clamp(f+(rnd()<.5?-1:1),0,TW-2);g++;
  }
  lf=f;return g;
}
// 관문: 한 칸만 뚫린 벽이 연속으로, 뚫린 칸이 매번 달라진다
function gates(g){
  const n=2+Math.floor(rnd()*2);
  for(let k=0;k<n;k++){
    if(g>N-24)break;
    lf=clamp(lf+shift(),0,TW-1);
    for(let j=0;j<2;j++)R[g++].obs=[...Array(TW).keys()].filter(q=>q!==lf).map(q=>({x:lx(q),t:'b',h:1.8,lg:true}));
    g+=Math.max(3,Math.round(spd(g)*.2*DEN));
  }
  return g;
}
// 가시 비: 줄마다 떨어지는 칸 수(1~3)와 위치가 제각각, 안전한 칸은 항상 있다
function rain(g){
  const n=1+Math.floor(rnd()*3);
  for(let k=0;k<n;k++){
    if(g>N-24)break;
    lf=clamp(lf+shift(),0,TW-1);
    R[g].drops=pick(lf,1+Math.floor(rnd()*(MAPS[curMap].diff>=4?3:2))).map(q=>({x:lx(q),y:9,st:0}));
    g+=Math.max(3,Math.round(spd(g)*.2*DEN));
  }
  return g;
}
// 레이저포: 발사블럭이 줄 맨 앞에 있고, 공이 1.5칸 전에 오면 그 줄 앞쪽 전체로 빔을 쏜다
function lasers(g){
  let L=14+Math.floor(rnd()*9);L=Math.min(L,N-22-g);if(L<8)return N;
  lf=clamp(lf+shift(),0,TW-1);
  pick(lf,MAPS[curMap].diff>=9?2+Math.floor(rnd()*2):MAPS[curMap].diff>=5?1+Math.floor(rnd()*2):1).forEach(q=>{
    const o={x:lx(q),s:g,e:g+L-1,st:0,f:g};LZ.push(o);
    for(let j=g;j<g+L;j++)(R[j].lz=R[j].lz||[]).push(o);
  });
  return g+L;
}
// 내려찍는 망치: 표시된 한 칸을 때린다
function slams(g){
  const n=1+Math.floor(rnd()*3);
  for(let k=0;k<n;k++){
    if(g>N-24)break;
    lf=clamp(lf+shift(),0,TW-1);
    R[g].hams=pick(lf,1+Math.floor(rnd()*(MAPS[curMap].diff>=4?3:2))).map(q=>{
      const left=q<=(TW-1)/2,d=Math.min(q,TW-1-q)+.8,len=Math.hypot(d,HY);
      return {x:lx(q),s:left?1:-1,xp:left?-TW/2-.3:TW/2+.3,len,hit:Math.acos(HY/len),th:2.6,st:0,t:0};
    });
    g+=Math.max(3,Math.round(spd(g)*.2*DEN));
  }
  return g;
}
// 세로로 도는 망치: 머리가 아래로 내려올 때 바로 아래 한 칸을 때린다
function segd(px,pz,ax,az,bx,bz){const dx=bx-ax,dz=bz-az,t=clamp(((px-ax)*dx+(pz-az)*dz)/(dx*dx+dz*dz),0,1);return Math.hypot(px-ax-t*dx,pz-az-t*dz)}
// 1번 망치: 공이 도착할 시각(tau)을 기준으로 박자를 맞춘다 (tau=0 일 때 바닥을 찍고 있음)
function hamTh(h,j){
  const tau=(j+.5-P.z)/P.sp,ph=((-tau/.7)%1+1)%1,up=2.6,hit=h.hit;
  if(ph<.12)return hit;
  if(ph<.55){const t=(ph-.12)/.43;return hit+(up-hit)*(t*t*(3-2*t))}
  if(ph<.8)return up;
  if(ph<.93){const t=(ph-.8)/.13;return up+(hit-up)*t*t}
  return hit;
}
// 2번 망치: 왼쪽/오른쪽 끝에서 멈췄다가 휘웅 하고 반대쪽으로 넘어가는 끊기는 스윙
function swingA(h){
  const u=(((P.t/h.T+h.ph)%2)+2)%2,half=Math.floor(u),f=u-half;
  let k=f<.72?0:(f-.72)/.28;k=k*k*(3-2*k);
  if(half===0)return h.side>0?Math.PI*(1-k):Math.PI+Math.PI*k;
  return h.side>0?Math.PI*k:2*Math.PI-Math.PI*k;
}
function spinners(g){
  const n=1+Math.floor(rnd()*(MAPS[curMap].diff>=6?3:2));
  for(let k=0;k<n;k++){
    if(g>N-24)break;
    const ls=pick(-1,TW>=5?2:1).sort((a,b)=>a-b),use=ls.filter((q,i)=>i===0||q-ls[i-1]>=3);
    R[g].spin=use.map(q=>({x:lx(q),ph:rnd()*2,T:1.1+rnd()*.5,side:rnd()<.5?1:-1}));
    g+=Math.max(4,Math.round(spd(g)*.22*DEN));
  }
  return g;
}
// 움직이는 바닥: 좁은 바닥 띠가 구멍 위에서 좌우로 흔들린다. 올라타서 같이 움직여야 한다
function mvSc(r,j){return r.mv.amp*Math.sin(P.t*r.mv.w+j*.12+r.mv.ph)*r.mv.r}
function slider(g){
  const L=12+Math.floor(rnd()*7),wide=TW>=4&&rnd()<.5,sh=wide?1.5:1,amp=Math.max(.4,TW/2-sh),w=1.6+MAPS[curMap].diff*.1+rnd()*.5,ph=rnd()*6.28;
  for(let k=0;k<L;k++){const r=R[g+k];r.sh=sh;r.mv={amp,w,ph,r:Math.min(1,(k+1)/3,(L-k)/3)}}
  return g+L;
}
// 로켓 바닥: 십자가 모양(5칸) 바닥이 플레이어가 가까이 오면 위로 발사되고 구멍이 남는다
function rockets(g){
  const n=1+(MAPS[curMap].diff>=6&&rnd()<.5?1:0);
  for(let k=0;k<n;k++){
    if(g>N-30)break;
    let f=clamp(lf+Math.floor(rnd()*3)-1,0,TW-1);if(TW===3&&f===1)f=rnd()<.5?0:2;lf=f;
    const cs=[];for(let q=0;q<TW;q++)if(Math.abs(q-f)>=2)cs.push(q);
    const cl=cs[Math.floor(rnd()*cs.length)],j0=g+1,grp={j0,st:0,t:0,y:0};RK.push(grp);
    const add=(row,q)=>{if(q<0||q>=TW)return;(R[row].rk=R[row].rk||[]).push({x:lx(q),g:grp})};
    add(j0,cl);add(j0,cl-1);add(j0,cl+1);add(j0-1,cl);add(j0+1,cl);
    g+=7;
  }
  return g;
}
// 떨어지는 발판: 구멍 위의 좁은 길. 한 줄을 밟으면 지나가는 건 되지만 곧 아래로 떨어져 사라진다
const CRD=.16,PT={jump:2,jumps:3.6,rain:2,wall:3,gate:3,laser:3.6,slam:2,spin:3,slide:3,rocket:3,crumble:2,plain:1.2};
function crAge(r){return r.cr&&r.cr.t!=null?P.t-r.cr.t:-1}
function crumble(g){
  const L=10+Math.floor(rnd()*7),sh=1,n=TW-1;
  let j=Math.floor(rnd()*n),keep=0;
  for(let k=0;k<L;k++){

    d.className='irow';
    d.innerHTML=`<span class="sw" style="background:radial-gradient(circle at 35% 30%,${k.c[0]},${k.c[1]} 45%,${k.c[2]})"></span><span class="tx"><b>${k.n} 공</b><small>${has?'보유 중':'◆ '+k.pr}</small></span>`;
    b.textContent=i===curSkin?'사용 중':has?'장착':'구매';
    b.disabled=i===curSkin||(!has&&wal()<k.pr);
    b.onclick=()=>{
      if(!has){addW(-k.pr);o.push(i);try{localStorage.setItem('rs_owned',JSON.stringify(o))}catch(e){}}
      curSkin=i;try{localStorage.setItem('rs_skin',i)}catch(e){}
      buildShop();
    };
    d.appendChild(b);$('items').appendChild(d);
  });
}
function showTab(t){
  const g=t==='game';
  $('pg-game').style.display=g?'flex':'none';$('pg-shop').style.display=g?'none':'flex';
  $('st').style.display=g?'block':'none';
  $('tb-game').className=g?'on':'';$('tb-shop').className=g?'':'on';
  if(g)buildList();else buildShop();
}
function selectMap(i){curMap=i;if(isOpen(i)){try{localStorage.setItem('rs_map',i)}catch(e){}}reset();buildList()}
function goHome(){if(state==='play')SEQ=0;RIFT=false;state='menu';$('ov').style.display='none';$('hud').style.display='none';$('home').style.display='flex';reset();showTab('game')}
function startGame(){reset();state='play';$('home').style.display='none';$('ov').style.display='none';$('hud').style.display='flex'}
function draw(){
  F=H*.8;hy=H*.25;camZ=P.z-7;
  const MP=MAPS[curMap];H0=MP.hidden?(MP.hue+P.t*25)%360:(MP.hue+Math.sin(P.t*.15)*MP.drift+360)%360;const hl=MP.hl;
  const fc=rgb(H0,MP.sat+8,hl);FR=fc[0];FGc=fc[1];FB=fc[2];fogK=0;
  let sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*10;sy=(Math.random()-.5)*10}
  ctx.save();ctx.translate(sx,sy);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,hs(H0,MP.sat,MP.top));g.addColorStop(.25,hs(H0,MP.sat+8,hl));g.addColorStop(1,hs(H0,MP.sat-5,MP.bot));
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);
  drawSky(MP);
  const start=Math.max(0,Math.floor(camZ)),end=Math.min(N-1,Math.floor(P.z)+52),pi=Math.min(Math.floor(P.z),N-1);
  for(let j=start;j<=end;j++){const q=R[j];if(q.mv)q.sc=mvSc(q,j)}
  const hb={};
  for(let j=start;j<=Math.min(N-1,end+1);j++){const q=R[j];if(q.spin)q.spin.forEach(h=>{const a=swingA(h),k=clamp(Math.floor(Math.min(j+.3,j+.5+Math.sin(a)-.45)),start,end);(hb[k]=hb[k]||[]).push([h,j,a])})}
  for(let i=end;i>=start;i--){
    const r=R[i],z0=Math.max(i,camZ+.5),z1=i+1;
    if(z1<=camZ+.5)continue;
    fogK=clamp((i-P.z-14)/36,0,1);drawDeco(r,i,MP);
    if(!r.gap&&!(r.cr&&crAge(r)>=CRD)){
      const sl=r.c+r.sc-r.sh,sr=r.c+r.sc+r.sh,nt=Math.round(r.sh*2);
      if(!r.rk)poly([pr(sl,0,z0),pr(sr,0,z0),pr(sr,0,z1),pr(sl,0,z1)],C(H0,32,56));
      for(let j=0;j<nt;j++){
        const a=sl+j+.04,b=sl+j+.96,cx=sl+j+.5-r.c,za=Math.max(i+.04,camZ+.5),zb=i+.96;
        const rt=r.rk&&r.rk.find(t=>t.x===cx);if(rt&&rt.g.st>=1)continue;if(r.rk)poly([pr(a-.04,0,z0),pr(b+.04,0,z0),pr(b+.04,0,z1),pr(a-.04,0,z1)],C(H0,32,56));
        const isPad=r.pad&&Math.abs(cx-r.px)<=r.pw-.5+.01,isDrop=(r.drops&&r.drops.some(d=>d.x===cx))||(r.hams&&r.hams.some(d=>d.x===cx));
        let h=H0,sa=30,l=isDrop?62:MP.tl;
        if(isPad){h=H0+75;sa=75;l=58}
        if(rt){h=12;sa=88;l=52}
        if(r.cr){h=34;sa=45;l=70}
        poly([pr(a,0,za),pr(b,0,za),pr(b,0,zb),pr(a,0,zb)],C(h,sa,l));
        poly([pr(a,0,za),pr(b,0,za),pr(b,-.12,za),pr(a,-.12,za)],C(h,sa,l-14));
      }
      const wc=C(H0,32,46);
      if(camX>sl)poly([pr(sl,0,z0),pr(sl,0,z1),pr(sl,-.7,z1),pr(sl,-.7,z0)],wc);
      if(camX<sr)poly([pr(sr,0,z0),pr(sr,0,z1),pr(sr,-.7,z1),pr(sr,-.7,z0)],wc);
      if(i>0&&i>=camZ+.5){
        const pv=R[i-1],fc=C(H0,34,40);
        if(pv.gap||(pv.cr&&crAge(pv)>=CRD))poly([pr(sl,0,i),pr(sr,0,i),pr(sr,-.7,i),pr(sl,-.7,i)],fc);
        else{
          const a=pv.c+pv.sc-pv.sh,b=pv.c+pv.sc+pv.sh;
          if(sl<a-.01){const e=Math.min(sr,a);poly([pr(sl,0,i),pr(e,0,i),pr(e,-.7,i),pr(sl,-.7,i)],fc)}
          if(sr>b+.01){const s0=Math.max(sl,b);poly([pr(s0,0,i),pr(sr,0,i),pr(sr,-.7,i),pr(s0,-.7,i)],fc)}
        }
      }
    }
    if(r.obs)r.obs.slice().sort((a,b)=>Math.abs(b.x+r.c-camX)-Math.abs(a.x+r.c-camX)).forEach(o=>drawObs(r,i,o));
    if(r.drops)r.drops.forEach(d=>drawObs(r,i,{x:d.x,t:'s',h:1},d.y));
    if(r.lz)r.lz.forEach(L=>{
      const za=Math.max(i,L.f),zb=Math.min(i+1,L.e-.18);
      if(L.st===1&&zb>za){const x=r.c+L.x;poly([pr(x-.46,0,za),pr(x+.46,0,za),pr(x+.46,0,zb),pr(x-.46,0,zb)],C(352,80,56));box(x-.4,x+.4,za,zb,.35,1.05,355,90,48);box(x-.18,x+.18,za,zb,.45,1.1,15,55,88)}
      if(L.e===i)drawEm(r,i,L);
    });
    if(r.hams)r.hams.forEach(h=>drawHam(r,i,h));
    if(r.cr&&crAge(r)>=CRD)drawCr(r,i);
    if(r.rk)r.rk.forEach(t=>{if(t.g.st===1)drawRk(r,i,t)});
    if(hb[i])hb[i].forEach(q=>drawSpin(R[q[1]],q[1],q[0],q[2]));
    if(r.gem!=null&&!r.got)drawGem(r,i);
    if(i===pi)ball();
  }
  if(MP.id==='sea'){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;for(let k=0;k<40;k++){const x=((hsh(k)*W+Math.sin(P.t+k)*14-camX*10*(.4+hsh(k+1)))%W+W)%W,y=H-((P.t*(25+hsh(k+2)*50)+hsh(k+3)*H)%H);ctx.globalAlpha=.25+.4*hsh(k+4);ctx.beginPath();ctx.arc(x,y,2+hsh(k+5)*5,0,7);ctx.stroke()}ctx.globalAlpha=1}
  if(MP.id==='lava'){ctx.fillStyle='#ff9a3c';for(let k=0;k<50;k++){const x=((hsh(k)*W+Math.sin(P.t*1.3+k)*20-camX*12*(.4+hsh(k+1)))%W+W)%W,y=H-((P.t*(40+hsh(k+2)*80)+hsh(k+3)*H)%H);ctx.globalAlpha=.4+.5*hsh(k+4);ctx.beginPath();ctx.arc(x,y,1+hsh(k+5)*2,0,7);ctx.fill()}ctx.globalAlpha=1}
  if(MP.id==='snow'){ctx.fillStyle='#fff';for(let k=0;k<70;k++){const x=((hsh(k)*W+Math.sin(P.t*.9+k)*18-camX*14*(.4+hsh(k+1)))%W+W)%W,y=(P.t*(50+hsh(k+2)*70)+hsh(k+3)*H)%H;ctx.globalAlpha=.5+.4*hsh(k+4);ctx.beginPath();ctx.arc(x,y,1+hsh(k+5)*2.2,0,7);ctx.fill()}ctx.globalAlpha=1}
  const now=performance.now();FX=FX.filter(f=>now-f.t<450);
  if(FX.length){
    const bp=pr(P.x,.46+P.y,P.z),bs=bp[2]*.46;
    FX.forEach(f=>{
      const a=(now-f.t)/450,al=1-a;
      ctx.globalAlpha=al;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bp[0],bp[1],bs*(1.3+a*2.2),0,7);ctx.stroke();
      ctx.fillStyle='#ff9ecb';
      for(let k=0;k<8;k++){const an=k*.785+.3,rr=bs*(1.2+a*2.8);ctx.beginPath();ctx.arc(bp[0]+Math.cos(an)*rr,bp[1]+Math.sin(an)*rr,bs*.16*al+1,0,7);ctx.fill()}
    });
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
function ball(){
  const sh=pr(P.x,0,P.z),p=pr(P.x,.46+P.y,P.z),s=p[2]*.46;
  if(!P.fall&&P.y>=0){ctx.fillStyle='rgba(20,30,60,.25)';ctx.beginPath();ctx.ellipse(sh[0],sh[1],s*(1-Math.min(P.y,2)*.15),s*.3,0,0,7);ctx.fill()}
  const g=ctx.createRadialGradient(p[0]-s*.35,p[1]-s*.4,s*.1,p[0],p[1],s);
  const K=SKINS[curSkin].c;g.addColorStop(0,K[0]);g.addColorStop(.45,K[1]);g.addColorStop(1,K[2]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p[0],p[1],s,0,7);ctx.fill();
}
let last=performance.now();
if(!isOpen(curMap))curMap=0;reset();showTab('game');$('tb-game').onclick=()=>showTab('game');$('tb-shop').onclick=()=>showTab('shop');$('st').onclick=stGo;$('hm').onclick=goHome;$('hb').onclick=goHome;$('hb').addEventListener('pointerdown',e=>e.stopPropagation());
function loop(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  if(shake>0)shake-=dt;
  updDrops(dt);
  update(dt);
  if(state==='menu'){P.z=1+((t/1000*6)%60);P.x=R[Math.floor(P.z)].c;P.t=t/1000;camX+=(0-camX)*Math.min(1,dt*2.5)}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
